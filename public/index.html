<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebGPU Arena FPS — Skeleton (Canvas fallback)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <h1>WebGPU Arena FPS — Skeleton</h1>
    <div id="status">Статус: <span id="conn">...подключение...</span></div>
    <div id="info">
      <div>clientId: <span id="clientId">-</span></div>
      <div>pending inputs: <span id="pending">0</span></div>
      <div>server last seq: <span id="serverSeq">0</span></div>
      <div>fps: <span id="fps">0</span></div>
    </div>
    <div id="controls">
      <div>Управление: WASD или стрелки — движение</div>
    </div>
  </div>

  <canvas id="game" width="800" height="600"></canvas>

  <script src="client.js"></script>
</body>
</html>
